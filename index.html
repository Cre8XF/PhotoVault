<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />

    <!-- Core theme color for PWA / Chrome UI -->
    <meta name="theme-color" content="#5729FF" />

    <!-- App description -->
    <meta
      name="description"
      content="PIXTR – Your AI-powered photo vault and smart photo organizer."

    <!-- Preconnect to external origins used at startup -->

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
