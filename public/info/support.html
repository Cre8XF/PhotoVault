<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixtr Support</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; margin-bottom: 20px; font-size: 2.5em; }
        h2 { color: #764ba2; margin-top: 30px; margin-bottom: 15px; }
        p { margin-bottom: 15px; color: #555; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn:hover { background: #764ba2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 Support</h1>
        <p>Need help? We're here for you!</p>

        <h2>Contact Support</h2>
        <p>Email: support@photovault.app</p>
        <p>Response time: Within 24 hours</p>

        <h2>Community</h2>
        <p>Join our community forum to connect with other users and get tips.</p>

        <h2>Documentation</h2>
        <p>Visit our documentation for detailed guides and tutorials.</p>

        <a href="#" onclick="window.close(); return false;" class="btn">Close</a>
    </div>
</body>
</html>
