<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>Pixtr – Support</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        line-height: 1.6;
        color: #333;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #667eea;
        margin-bottom: 20px;
        font-size: 2.5em;
      }
      h2 {
        color: #764ba2;
        margin-top: 30px;
        margin-bottom: 15px;
      }
      p {
        margin-bottom: 15px;
        color: #555;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: #667eea;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        margin-top: 20px;
        transition: background 0.3s;
      }
      .btn:hover {
        background: #764ba2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>💬 Support</h1>
      <p>Trenger du hjelp? Vi er her for deg!</p>

      <h2>Kontakt support</h2>
      <p>E-post: support@photovault.app</p>
      <p>Svartid: Innen 24 timer</p>

      <h2>Community</h2>
      <p>Bli med i vårt forum for tips, hjelp og diskusjoner.</p>

      <h2>Dokumentasjon</h2>
      <p>Besøk vår dokumentasjon for guider og detaljerte forklaringer.</p>

      <a href="#" onclick="window.close(); return false;" class="btn">Lukk</a>
    </div>
  </body>
</html>
