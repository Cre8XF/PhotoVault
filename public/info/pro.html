<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixtr Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #f5576c; margin-bottom: 20px; font-size: 2.5em; }
        h2 { color: #f093fb; margin-top: 30px; margin-bottom: 15px; }
        p { margin-bottom: 15px; color: #555; }
        ul { margin-left: 20px; margin-bottom: 15px; }
        .feature { margin-bottom: 10px; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>👑 Pixtr Pro</h1>
        <p>Unlock the full potential of Pixtr with Pro features.</p>

        <h2>Pro Features</h2>
        <ul>
            <li class="feature">✨ Unlimited storage</li>
            <li class="feature">🤖 Advanced AI features</li>
            <li class="feature">📱 Priority support</li>
            <li class="feature">🎨 Background removal</li>
            <li class="feature">🔍 Smart search</li>
            <li class="feature">📤 Batch operations</li>
        </ul>

        <h2>Pricing</h2>
        <p>Coming soon! Stay tuned for our Pro subscription options.</p>

        <a href="#" onclick="window.close(); return false;" class="btn">Close</a>
    </div>
</body>
</html>
