<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>Pixtr Pro</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        line-height: 1.6;
        color: #333;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        padding: 20px;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #f5576c;
        margin-bottom: 20px;
        font-size: 2.5em;
      }
      h2 {
        color: #f093fb;
        margin-top: 30px;
        margin-bottom: 15px;
      }
      p {
        margin-bottom: 15px;
        color: #555;
      }
      ul {
        margin-left: 20px;
        margin-bottom: 15px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
        text-decoration: none;
        border-radius: 8px;
        margin-top: 20px;
        transition: transform 0.2s;
      }
      .btn:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>👑 Pixtr Pro</h1>
      <p>Lås opp hele kraften i Pixtr med Pro-funksjoner.</p>

      <h2>Pro-funksjoner</h2>
      <ul>
        <li class="feature">✨ Ubegrenset lagring</li>
        <li class="feature">🤖 Avanserte AI-funksjoner</li>
        <li class="feature">📱 Prioritert support</li>
        <li class="feature">🎨 Bakgrunnsfjerning</li>
        <li class="feature">🔍 Smart søk</li>
        <li class="feature">📤 Masseoperasjoner</li>
      </ul>

      <h2>Priser</h2>
      <p>Kommer snart! Følg med for Pro-abonnement.</p>

      <a href="#" onclick="window.close(); return false;" class="btn">Lukk</a>
    </div>
  </body>
</html>
