[build]
  command = "npm run build"
  publish = "dist"
  node_version = "20"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = """
.firebaserc,
cloudflare/upload-worker/**,
docs/**,
dist/**,
worker/**
"""

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
