[build]
  command = "npm run build"
  publish = "dist"
  node_version = "20"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = """
.firebaserc,
cloudflare/upload-worker/**,
docs/**,
dist/**,
worker/**
"""

[functions]
  node_bundler = "esbuild"

# Serve manifest.json with proper headers (must come before catch-all)
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# SPA catch-all redirect (must come after static file rules)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["none"]}
  force = false
