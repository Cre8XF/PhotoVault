# ============================================================================
# Wrangler Configuration – Pixtr Upload Worker (SAFE MODE)
# ============================================================================
# Purpose:
# - Enable VERIFIED uploads to R2 via Cloudflare Worker
# - Use workers.dev (no custom domain yet)
# - Eliminate DNS / routing / zone issues
# ============================================================================

name = "pixtr-upload-worker"
main = "upload-worker.js"
compatibility_date = "2024-12-08"

# ✅ IMPORTANT: Enable workers.dev
workers_dev = true

# ============================================================================
# R2 BUCKET BINDING
# ============================================================================
# Stores user-uploaded photos
# Path logic enforced inside upload-worker.js
# Example path:
#   users/{userId}/{albumId}/{filename}
# ============================================================================

[[r2_buckets]]
binding = "PIXTR_USERS"
bucket_name = "pixtr-users"

# ============================================================================
# ENVIRONMENT VARIABLES (Worker-side only)
# ============================================================================
[vars]
R2_PUBLIC_URL = "https://images.pixtr.cloud"
FIREBASE_PROJECT_ID = "photovault-app-a0946"

# ============================================================================
# 🚫 INTENTIONALLY REMOVED (FOR NOW)
# ============================================================================
# - routes
# - zone_name
# - custom domains (upload.pixtr.cloud)
# - production / staging envs
#
# These WILL be added back AFTER uploads are verified working.
# ============================================================================
