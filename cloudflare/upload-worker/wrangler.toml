# ============================================================================
# Wrangler Configuration for Pixtr Upload Worker
# ============================================================================

name = "pixtr-upload-worker"
main = "upload-worker.js"
compatibility_date = "2024-12-08"
workers_dev = true

# ============================================================================
# R2 BUCKET BINDINGS
# ============================================================================

# PIXTR_PHOTOS: Stores photo/video FILES
# Structure: users/{userId}/{albumId}/{filename}
[[r2_buckets]]
binding = "PIXTR_PHOTOS"
bucket_name = "pixtr-photos"
preview_bucket_name = "pixtr-photos-preview" # Optional: for testing

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
[vars]
R2_PUBLIC_URL = "https://photos.pixtr.cloud"

# ============================================================================
# DEPLOYMENT SETTINGS
# ============================================================================

# Production environment
[env.production]
name = "pixtr-upload-worker-production"
workers_dev = false
routes = [
  { pattern = "upload.pixtr.cloud/*", zone_name = "pixtr.cloud" }
]

[env.production.vars]
R2_PUBLIC_URL = "https://photos.pixtr.cloud"

# Staging environment
[env.staging]
name = "pixtr-upload-worker-staging"
workers_dev = false
routes = [
  { pattern = "upload-staging.pixtr.cloud/*", zone_name = "pixtr.cloud" }
]

[env.staging.vars]
R2_PUBLIC_URL = "https://photos-staging.pixtr.cloud"

# ============================================================================
# DEPLOYMENT INSTRUCTIONS
# ============================================================================
# 1. Install Wrangler CLI: npm install -g wrangler
# 2. Login: wrangler login
# 3. Create R2 bucket (if not exists):
#    wrangler r2 bucket create pixtr-photos
# 4. Deploy to production:
#    cd cloudflare/upload-worker
#    wrangler deploy --env production
#
# For development/testing:
# wrangler dev --local
#
# IMPORTANT: After deployment, update your .env file:
# VITE_R2_UPLOAD_ENDPOINT=https://upload.pixtr.cloud
#
# The Worker will be available at:
# - https://upload.pixtr.cloud/upload (POST - file upload)
# - https://upload.pixtr.cloud/health (GET - health check)
# ============================================================================
