# ============================================================================
# Wrangler Configuration for Pixtr Metadata Worker
# ============================================================================

name = "pixtr-metadata-worker"
main = "metadata-worker.js"
compatibility_date = "2024-12-08"
workers_dev = true

# ============================================================================
# R2 BUCKET BINDINGS
# ============================================================================

# PIXTR_STORAGE: Stores photo/video FILES only
# Structure: users/{userId}/{albumId}/{filename}
[[r2_buckets]]
binding = "PIXTR_STORAGE"
bucket_name = "pixtr-photos"
preview_bucket_name = "pixtr-photos-preview" # Optional: for testing

# PIXTR_METADATA: Stores metadata JSON files ONLY (SEPARATE BUCKET)
# Structure: {userId}.json
# CRITICAL: This is a SEPARATE bucket from PIXTR_STORAGE
[[r2_buckets]]
binding = "PIXTR_METADATA"
bucket_name = "pixtr-metadata"
preview_bucket_name = "pixtr-metadata-preview" # Optional: for testing

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
[vars]
ADMIN_TOKEN = "your-secure-admin-token-here" # Replace with actual secure token

# ============================================================================
# DEPLOYMENT SETTINGS
# ============================================================================
# Production environment
[env.production]
name = "pixtr-metadata-worker-production"
workers_dev = false
routes = [
  { pattern = "pixtr.cloud/api/*", zone_name = "pixtr.cloud" },
  { pattern = "www.pixtr.cloud/api/*", zone_name = "pixtr.cloud" }
]

# Staging environment
[env.staging]
name = "pixtr-metadata-worker-staging"
workers_dev = false
routes = [
  { pattern = "staging.pixtr.cloud/api/*", zone_name = "pixtr.cloud" }
]

# ============================================================================
# DEPLOYMENT INSTRUCTIONS
# ============================================================================
# 1. Install Wrangler CLI: npm install -g wrangler
# 2. Login: wrangler login
# 3. Create R2 buckets:
#    wrangler r2 bucket create pixtr-photos
#    wrangler r2 bucket create pixtr-metadata
# 4. Set ADMIN_TOKEN to a secure random value in wrangler.toml
# 5. Deploy to production:
#    wrangler deploy --env production
#
# For development:
# wrangler dev --local
#
# CRITICAL: The Worker responds on these routes:
# - https://pixtr.cloud/api/metadata (GET/POST)
# - https://www.pixtr.cloud/api/metadata (GET/POST)
#
# Frontend must set: VITE_METADATA_API_URL=https://www.pixtr.cloud
